name: Build and Release Autonomous Kernel App

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      target_platform:
        description: 'Target Build Platform'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - web
          - android

jobs:
  build-web:
    name: Build Web Production App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Project Dependencies
        run: npm install --legacy-peer-deps

      - name: Lint & Typecheck Codebase
        run: npm run lint

      - name: Compile and Build Web App
        run: npm run build

      - name: Upload Web Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist/
          retention-days: 14

  build-android:
    name: Build Android Mobile Application (APK)
    runs-on: ubuntu-latest
    if: github.event.inputs.target_platform == 'all' || github.event.inputs.target_platform == 'android' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies & Build Web Assets
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: Sync Web Assets to Android Project
        run: |
          npx cap sync android

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Make Gradle Executable
        run: |
          chmod +x android/gradlew

      - name: Compile and Build Real Android APK (Gradle)
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare APK Output File
        run: |
          mkdir -p release-output
          APK_PATH=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -n "$APK_PATH" ] && [ -f "$APK_PATH" ]; then
            echo "Found APK at: $APK_PATH"
            cp "$APK_PATH" release-output/NeuroCore-v1.0.apk
            ls -lh release-output/NeuroCore-v1.0.apk
          else
            echo "Error: No APK file generated!"
            exit 1
          fi

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NeuroCore-Android-APK
          path: release-output/NeuroCore-v1.0.apk
          retention-days: 14
